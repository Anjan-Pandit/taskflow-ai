
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow AI</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <h1>
            TaskFlow AI
        </h1>

        <p>
            Task Management Dashboard
        </p>

    </header>



    <main class="container">


        <!-- =========================
             ADD NEW TASK
        ========================== -->

        <section class="task-form-section">

            <h2>
                Add New Task
            </h2>


            <form id="taskForm">


                <!-- Task Title -->

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>


                    <input
                        type="text"
                        id="title"
                        placeholder="Enter task title"
                    >


                    <span
                        id="titleError"
                        class="error-message"
                    ></span>

                </div>



                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>


                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                    >

                </div>



                <!-- Project ID -->

                <div class="form-group">

                    <label for="projectId">
                        Project ID
                    </label>


                    <input
                        type="number"
                        id="projectId"
                        placeholder="Enter project ID"
                        min="1"
                    >

                </div>



                <!-- Priority -->

                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>


                    <select id="priority">

                        <option value="low">
                            Low
                        </option>


                        <option
                            value="medium"
                            selected
                        >
                            Medium
                        </option>


                        <option value="high">
                            High
                        </option>

                    </select>

                </div>



                <!-- Due Date -->

                <div class="form-group">

                    <label for="dueDate">
                        Due Date
                    </label>


                    <input
                        type="date"
                        id="dueDate"
                    >

                </div>



                <!-- Add Task Button -->

                <button type="submit">
                    Add Task
                </button>


            </form>

        </section>



        <!-- =========================
             TASK DASHBOARD
        ========================== -->

        <section class="task-list-section">


            <h2>
                Your Tasks
            </h2>



            <!-- Statistics -->

            <div class="stats-container">


                <div class="stat-card">

                    <h3>
                        Total Tasks
                    </h3>

                    <p id="totalTasks">
                        0
                    </p>

                </div>



                <div class="stat-card">

                    <h3>
                        Pending
                    </h3>

                    <p id="pendingTasks">
                        0
                    </p>

                </div>



                <div class="stat-card">

                    <h3>
                        Completed
                    </h3>

                    <p id="completedTasks">
                        0
                    </p>

                </div>



                <div class="stat-card">

                    <h3>
                        High Priority
                    </h3>

                    <p id="highPriorityTasks">
                        0
                    </p>

                </div>


            </div>



            <!-- Search -->

            <input
                type="text"
                id="searchTasks"
                placeholder="Search tasks..."
            >



            <!-- Sorting -->

            <select id="sortTasks">

                <option value="default">
                    Sort Tasks
                </option>


                <option value="priority">
                    Priority: High → Low
                </option>


                <option value="dueDate">
                    Due Date: Earliest First
                </option>

            </select>



            <!-- Filtering -->

            <select id="filterTasks">

                <option value="all">
                    All Tasks
                </option>


                <option value="pending">
                    Pending
                </option>


                <option value="completed">
                    Completed
                </option>


                <option value="high">
                    High Priority
                </option>


                <option value="medium">
                    Medium Priority
                </option>


                <option value="low">
                    Low Priority
                </option>

            </select>



            <!-- Task List -->

            <div id="taskList"></div>


        </section>


    </main>



    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
